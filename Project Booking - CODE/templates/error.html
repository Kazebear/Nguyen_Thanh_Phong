{% extends "base.html" %}

{% block title %}Lỗi {{ code }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="panel text-center py-5">
  <div class="empty-icon">⚠️</div>
  <h1 class="display-6">{{ code }}</h1>
  <p class="text-muted">{{ message }}</p>
  <div>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Về trang chủ</a>
  </div>
</section>
{% endblock %}
