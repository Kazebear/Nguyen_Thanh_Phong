<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64"
     role="img" aria-label="Office Booking">
  <title>Office Booking</title>
  <!-- Biến thể dùng trên nền tối: chữ đổi sang tông sáng cho đủ tương phản.
       Chỉ dùng cho README trên GitHub ở chế độ tối, không dùng trong ứng dụng. -->
  <rect width="64" height="64" rx="16" fill="#2563eb"/>
  <g fill="#ffffff">
    <rect x="14" y="17"   width="36" height="7" rx="3.5" opacity=".38"/>
    <rect x="14" y="28.5" width="14" height="7" rx="3.5" opacity=".38"/>
    <rect x="32" y="28.5" width="18" height="7" rx="3.5"/>
    <rect x="14" y="40"   width="36" height="7" rx="3.5" opacity=".38"/>
  </g>
  <text x="80" y="40"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
        font-size="23" letter-spacing="-.4">
    <tspan fill="#e2e8f0" font-weight="700">Office</tspan><tspan fill="#60a5fa" font-weight="600"> Booking</tspan>
  </text>
</svg>
